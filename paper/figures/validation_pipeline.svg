<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260">
  <rect width="760" height="260" fill="white"/>
  <text x="34" y="42" font-family="Arial" font-size="24" font-weight="700">Validation pipeline</text>
  <g font-family="Arial" font-size="14" text-anchor="middle">
    <g>
      <rect x="34" y="90" width="130" height="62" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
      <text x="99" y="116" font-weight="700">Vectors</text>
      <text x="99" y="138">C/Python agree</text>
    </g>
    <g>
      <rect x="204" y="90" width="130" height="62" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
      <text x="269" y="116" font-weight="700">Unit tests</text>
      <text x="269" y="138">determinism</text>
    </g>
    <g>
      <rect x="374" y="90" width="130" height="62" rx="6" fill="#fff8e1" stroke="#f9a825"/>
      <text x="439" y="116" font-weight="700">Sanity stats</text>
      <text x="439" y="138">entropy/avalanche</text>
    </g>
    <g>
      <rect x="544" y="90" width="160" height="62" rx="6" fill="#ffebee" stroke="#c62828"/>
      <text x="624" y="116" font-weight="700">External batteries</text>
      <text x="624" y="138">WARN remains</text>
    </g>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
      </marker>
    </defs>
    <line x1="164" y1="121" x2="204" y2="121"/>
    <line x1="334" y1="121" x2="374" y2="121"/>
    <line x1="504" y1="121" x2="544" y2="121"/>
  </g>
  <text x="34" y="210" font-family="Arial" font-size="14" fill="#444">Passing this pipeline is evidence for implementation quality and defect screening, not a cryptographic proof.</text>
</svg>

