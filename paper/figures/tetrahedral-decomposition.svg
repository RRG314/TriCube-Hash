<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">TriCube cube-to-tetrahedra decomposition</title>
  <desc id="desc">A unit cube with eight local vertices and the six tetrahedral neighborhoods used by TriCube.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .small { font-size: 12px; }
      .edge { stroke: #6b7280; stroke-width: 1.3; fill: none; }
      .diag { stroke: #d97706; stroke-width: 2; fill: none; }
      .tet { fill: #eef7ff; stroke: #2563a8; stroke-width: 1.2; }
      .node { fill: #ffffff; stroke: #2563a8; stroke-width: 1.5; }
      .panel { fill: #f7f9fb; stroke: #d0d7de; }
    </style>
  </defs>
  <rect x="0" y="0" width="920" height="520" fill="#ffffff"/>
  <text x="40" y="48" class="title">Cube Cell Decomposition into Six Tetrahedra</text>
  <text x="40" y="76" class="small">Each 2 x 2 x 2 cell uses the same local schedule. The six tetrahedra share vertices, so in-place updates make the listed order part of the specification.</text>

  <g transform="translate(80,120)">
    <!-- cube -->
    <polygon points="90,240 250,240 330,170 170,170" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
    <polygon points="90,80 250,80 330,10 170,10" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
    <line class="edge" x1="90" y1="240" x2="90" y2="80"/>
    <line class="edge" x1="250" y1="240" x2="250" y2="80"/>
    <line class="edge" x1="330" y1="170" x2="330" y2="10"/>
    <line class="edge" x1="170" y1="170" x2="170" y2="10"/>
    <line class="diag" x1="90" y1="240" x2="330" y2="10"/>
    <line class="diag" x1="90" y1="240" x2="250" y2="240"/>
    <line class="diag" x1="90" y1="240" x2="330" y2="170"/>
    <line class="diag" x1="90" y1="240" x2="170" y2="170"/>
    <line class="diag" x1="90" y1="240" x2="90" y2="80"/>
    <line class="diag" x1="90" y1="240" x2="250" y2="80"/>

    <circle class="node" cx="90" cy="240" r="18"/><text x="80" y="245" class="small">v0</text>
    <circle class="node" cx="250" cy="240" r="18"/><text x="240" y="245" class="small">v1</text>
    <circle class="node" cx="170" cy="170" r="18"/><text x="160" y="175" class="small">v2</text>
    <circle class="node" cx="330" cy="170" r="18"/><text x="320" y="175" class="small">v3</text>
    <circle class="node" cx="90" cy="80" r="18"/><text x="80" y="85" class="small">v4</text>
    <circle class="node" cx="250" cy="80" r="18"/><text x="240" y="85" class="small">v5</text>
    <circle class="node" cx="170" cy="10" r="18"/><text x="160" y="15" class="small">v6</text>
    <circle class="node" cx="330" cy="10" r="18"/><text x="320" y="15" class="small">v7</text>

    <text x="35" y="305" class="small">The long body diagonal v0-v7 anchors all six local tetrahedra.</text>
  </g>

  <g transform="translate(520,125)">
    <rect class="panel" x="0" y="0" width="350" height="310" rx="8"/>
    <text x="22" y="34" class="label">Local tetrahedron order</text>
    <text x="22" y="68" class="small">1. (v0, v1, v3, v7)</text>
    <text x="22" y="96" class="small">2. (v0, v3, v2, v7)</text>
    <text x="22" y="124" class="small">3. (v0, v2, v6, v7)</text>
    <text x="22" y="152" class="small">4. (v0, v6, v4, v7)</text>
    <text x="22" y="180" class="small">5. (v0, v4, v5, v7)</text>
    <text x="22" y="208" class="small">6. (v0, v5, v1, v7)</text>
    <line x1="22" y1="230" x2="318" y2="230" stroke="#d0d7de"/>
    <text x="22" y="260" class="small">Global order: cz, cy, cx over {0,1},</text>
    <text x="22" y="282" class="small">then the six local tetrahedra above.</text>
  </g>
</svg>
