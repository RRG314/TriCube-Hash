<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">TriCube round flow</title>
  <desc id="desc">The order of operations in one TriCube permutation round.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .small { font-size: 12px; }
      .box { fill: #eef7ff; stroke: #2563a8; stroke-width: 1.5; }
      .warn { fill: #fff7e6; stroke: #a36a00; stroke-width: 1.5; }
      .arrow { stroke: #42526e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#42526e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="430" fill="#ffffff"/>
  <text x="40" y="46" class="title">One TriCube Permutation Round</text>
  <text x="40" y="74" class="small">All layers update the same 2048-bit state. Tetrahedral, edge, and shell layers are in-place; order is therefore part of the specification.</text>

  <g transform="translate(40,120)">
    <rect class="box" x="0" y="0" width="135" height="90" rx="8"/>
    <text x="22" y="30" class="label">State S</text>
    <text x="18" y="56" class="small">32 lanes</text>
    <text x="18" y="74" class="small">64 bits each</text>

    <path class="arrow" d="M140,45 H185"/>
    <rect class="box" x="190" y="0" width="155" height="90" rx="8"/>
    <text x="218" y="28" class="label">Tetra mix</text>
    <text x="212" y="53" class="small">48 neighborhoods</text>
    <text x="212" y="72" class="small">ARX, in-place</text>

    <path class="arrow" d="M350,45 H395"/>
    <rect class="box" x="400" y="0" width="145" height="90" rx="8"/>
    <text x="430" y="28" class="label">Edge couple</text>
    <text x="423" y="53" class="small">54 grid edges</text>
    <text x="423" y="72" class="small">in-place</text>

    <path class="arrow" d="M550,45 H595"/>
    <rect class="box" x="600" y="0" width="145" height="90" rx="8"/>
    <text x="627" y="28" class="label">Shell couple</text>
    <text x="626" y="53" class="small">5 shell lanes</text>
    <text x="626" y="72" class="small">global feedback</text>

    <path class="arrow" d="M750,45 H795"/>
    <rect class="box" x="800" y="0" width="135" height="90" rx="8"/>
    <text x="830" y="28" class="label">Permute</text>
    <text x="824" y="53" class="small">T[i]=S[9i+5]</text>
    <text x="824" y="72" class="small">mod 32</text>

    <path class="arrow" d="M865,95 V145 H68 V99"/>
    <text x="375" y="142" class="small">round constant injection completes the round, then the next round begins</text>
  </g>

  <g transform="translate(80,285)">
    <rect class="warn" x="0" y="0" width="820" height="90" rx="8"/>
    <text x="22" y="30" class="label">Mode use</text>
    <text x="22" y="56" class="small">Hash/XOF absorb message blocks, finalize with length and output length, then squeeze output.</text>
    <text x="22" y="76" class="small">Stream mode initializes from a seed/domain, absorbs a counter schedule, permutes, then squeezes deterministic output for testing.</text>
  </g>
</svg>
