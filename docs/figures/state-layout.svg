<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">TriCube state layout</title>
  <desc id="desc">A 3 by 3 by 3 vertex-lane grid plus five shell/global lanes.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 600; }
      .small { font-size: 12px; }
      .lane { fill: #eef7ff; stroke: #2563a8; stroke-width: 1.4; }
      .shell { fill: #fff3d6; stroke: #a36a00; stroke-width: 1.5; }
      .edge { stroke: #7b8794; stroke-width: 1.1; opacity: 0.65; }
      .axis { stroke: #42526e; stroke-width: 1.3; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#42526e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>
  <text x="40" y="48" class="title">TriCube 2048-bit State Layout</text>
  <text x="40" y="76" class="small">State lanes S[0]..S[31] are 64-bit words. Lanes S[0]..S[26] form a 3 x 3 x 3 vertex grid. Lanes S[27]..S[31] are shell/global lanes.</text>

  <!-- grid edges -->
  <g transform="translate(80,120)">
    <line class="axis" x1="20" y1="375" x2="120" y2="375"/>
    <line class="axis" x1="20" y1="375" x2="20" y2="285"/>
    <line class="axis" x1="20" y1="375" x2="85" y2="315"/>
    <text x="126" y="379" class="small">x</text>
    <text x="10" y="278" class="small">y</text>
    <text x="91" y="312" class="small">z</text>

    <g id="edges">
      <line class="edge" x1="80" y1="310" x2="180" y2="310"/>
      <line class="edge" x1="180" y1="310" x2="280" y2="310"/>
      <line class="edge" x1="80" y1="310" x2="80" y2="210"/>
      <line class="edge" x1="180" y1="310" x2="180" y2="210"/>
      <line class="edge" x1="280" y1="310" x2="280" y2="210"/>
      <line class="edge" x1="80" y1="210" x2="180" y2="210"/>
      <line class="edge" x1="180" y1="210" x2="280" y2="210"/>
      <line class="edge" x1="80" y1="110" x2="180" y2="110"/>
      <line class="edge" x1="180" y1="110" x2="280" y2="110"/>
      <line class="edge" x1="80" y1="110" x2="80" y2="210"/>
      <line class="edge" x1="180" y1="110" x2="180" y2="210"/>
      <line class="edge" x1="280" y1="110" x2="280" y2="210"/>

      <line class="edge" x1="150" y1="250" x2="250" y2="250"/>
      <line class="edge" x1="250" y1="250" x2="350" y2="250"/>
      <line class="edge" x1="150" y1="250" x2="150" y2="150"/>
      <line class="edge" x1="250" y1="250" x2="250" y2="150"/>
      <line class="edge" x1="350" y1="250" x2="350" y2="150"/>
      <line class="edge" x1="150" y1="150" x2="250" y2="150"/>
      <line class="edge" x1="250" y1="150" x2="350" y2="150"/>
      <line class="edge" x1="150" y1="50" x2="250" y2="50"/>
      <line class="edge" x1="250" y1="50" x2="350" y2="50"/>
      <line class="edge" x1="150" y1="50" x2="150" y2="150"/>
      <line class="edge" x1="250" y1="50" x2="250" y2="150"/>
      <line class="edge" x1="350" y1="50" x2="350" y2="150"/>

      <line class="edge" x1="80" y1="310" x2="150" y2="250"/>
      <line class="edge" x1="180" y1="310" x2="250" y2="250"/>
      <line class="edge" x1="280" y1="310" x2="350" y2="250"/>
      <line class="edge" x1="80" y1="210" x2="150" y2="150"/>
      <line class="edge" x1="180" y1="210" x2="250" y2="150"/>
      <line class="edge" x1="280" y1="210" x2="350" y2="150"/>
      <line class="edge" x1="80" y1="110" x2="150" y2="50"/>
      <line class="edge" x1="180" y1="110" x2="250" y2="50"/>
      <line class="edge" x1="280" y1="110" x2="350" y2="50"/>
    </g>

    <!-- vertex lanes, back layer z=1 visually offset -->
    <g>
      <circle class="lane" cx="80" cy="310" r="19"/><text x="69" y="315" class="small">S0</text>
      <circle class="lane" cx="180" cy="310" r="19"/><text x="166" y="315" class="small">S1</text>
      <circle class="lane" cx="280" cy="310" r="19"/><text x="266" y="315" class="small">S2</text>
      <circle class="lane" cx="80" cy="210" r="19"/><text x="66" y="215" class="small">S3</text>
      <circle class="lane" cx="180" cy="210" r="19"/><text x="166" y="215" class="small">S4</text>
      <circle class="lane" cx="280" cy="210" r="19"/><text x="266" y="215" class="small">S5</text>
      <circle class="lane" cx="80" cy="110" r="19"/><text x="66" y="115" class="small">S6</text>
      <circle class="lane" cx="180" cy="110" r="19"/><text x="166" y="115" class="small">S7</text>
      <circle class="lane" cx="280" cy="110" r="19"/><text x="266" y="115" class="small">S8</text>

      <circle class="lane" cx="150" cy="250" r="19"/><text x="136" y="255" class="small">S9</text>
      <circle class="lane" cx="250" cy="250" r="19"/><text x="233" y="255" class="small">S10</text>
      <circle class="lane" cx="350" cy="250" r="19"/><text x="333" y="255" class="small">S11</text>
      <circle class="lane" cx="150" cy="150" r="19"/><text x="133" y="155" class="small">S12</text>
      <circle class="lane" cx="250" cy="150" r="19"/><text x="233" y="155" class="small">S13</text>
      <circle class="lane" cx="350" cy="150" r="19"/><text x="333" y="155" class="small">S14</text>
      <circle class="lane" cx="150" cy="50" r="19"/><text x="133" y="55" class="small">S15</text>
      <circle class="lane" cx="250" cy="50" r="19"/><text x="233" y="55" class="small">S16</text>
      <circle class="lane" cx="350" cy="50" r="19"/><text x="333" y="55" class="small">S17</text>

      <circle class="lane" cx="220" cy="190" r="19"/><text x="203" y="195" class="small">S18</text>
      <circle class="lane" cx="320" cy="190" r="19"/><text x="303" y="195" class="small">S19</text>
      <circle class="lane" cx="420" cy="190" r="19"/><text x="403" y="195" class="small">S20</text>
      <circle class="lane" cx="220" cy="90" r="19"/><text x="203" y="95" class="small">S21</text>
      <circle class="lane" cx="320" cy="90" r="19"/><text x="303" y="95" class="small">S22</text>
      <circle class="lane" cx="420" cy="90" r="19"/><text x="403" y="95" class="small">S23</text>
      <circle class="lane" cx="220" cy="-10" r="19"/><text x="203" y="-5" class="small">S24</text>
      <circle class="lane" cx="320" cy="-10" r="19"/><text x="303" y="-5" class="small">S25</text>
      <circle class="lane" cx="420" cy="-10" r="19"/><text x="403" y="-5" class="small">S26</text>
    </g>
  </g>

  <g transform="translate(610,140)">
    <text x="0" y="0" class="label">Shell/global lanes</text>
    <text x="0" y="25" class="small">These lanes are ordinary 64-bit state words used for global coupling.</text>
    <text x="0" y="43" class="small">They are not external entropy sources.</text>
    <circle class="shell" cx="30" cy="90" r="24"/><text x="14" y="95" class="small">S27</text>
    <circle class="shell" cx="90" cy="90" r="24"/><text x="74" y="95" class="small">S28</text>
    <circle class="shell" cx="150" cy="90" r="24"/><text x="134" y="95" class="small">S29</text>
    <circle class="shell" cx="210" cy="90" r="24"/><text x="194" y="95" class="small">S30</text>
    <circle class="shell" cx="270" cy="90" r="24"/><text x="254" y="95" class="small">S31</text>

    <rect x="0" y="160" width="280" height="130" rx="8" fill="#f7f9fb" stroke="#d0d7de"/>
    <text x="18" y="188" class="label">Coordinate rule</text>
    <text x="18" y="218" class="small">index(x,y,z) = x + 3(y + 3z)</text>
    <text x="18" y="244" class="small">x,y,z are each 0, 1, or 2</text>
    <text x="18" y="270" class="small">lane word size = 64 bits</text>
  </g>
</svg>
