name: Build Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "MANIFEST.in"
      - "python/**"
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
