name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python package
        run: python -m pip install -e ".[test]"

      - name: Build and test C implementation
        if: runner.os != 'Windows'
        run: make -C c test

      - name: Run Python tests
        run: pytest -q

      - name: Run crypto-analysis quick screens
        if: runner.os != 'Windows'
        run: python tests/crypto_analysis/run_all_screens.py --profile quick --variants baseline,fast8x --out /tmp/tricube-quick

      - name: Run hash-mode quick screens
        if: runner.os != 'Windows'
        run: python tests/crypto_analysis/hash_mode/run_hash_screens.py --profile quick --implementations baseline_hash --out /tmp/tricube-hash-quick

      - name: CLI smoke
        run: |
          python -m tricube.cli hash --hex 616263
          python -m tricube.cli xof --hex 616263 --bytes 64
